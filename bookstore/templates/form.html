{% extends 'base.html' %}

{% block title %}{{ action }} Book — PageTurner{% endblock %}

{% block main %}
<div class="mb-6">
  {% if book.id %}
    <a href="{% url 'book_detail' book.id %}" class="inline-flex items-center gap-1.5 text-sm text-gray-500 hover:text-indigo-600 transition-colors">
  {% else %}
    <a href="{% url 'book_list' %}" class="inline-flex items-center gap-1.5 text-sm text-gray-500 hover:text-indigo-600 transition-colors">
  {% endif %}
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
    </svg>
    Cancel
  </a>
</div>

<div class="max-w-2xl">
  <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
    <div class="h-1.5 bg-indigo-500"></div>
    <div class="p-8">

      <h1 class="text-xl font-bold text-gray-900 mb-6">{{ action }} Book</h1>

      {% if book.id %}
        <form method="POST" action="{% url 'book_edit' book.id %}">
      {% else %}
        <form method="POST" action="{% url 'book_create' %}">
      {% endif %}
        {% csrf_token %}

        <div class="space-y-5">

          <div>
            <label for="title" class="block text-sm font-medium text-gray-700 mb-1.5">Title</label>
            <input
              type="text"
              id="title"
              name="title"
              value="{{ book.title }}"
              required
              placeholder="e.g. The Pragmatic Programmer"
              class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"
            />
          </div>

          <div>
            <label for="author" class="block text-sm font-medium text-gray-700 mb-1.5">Author</label>
            <input
              type="text"
              id="author"
              name="author"
              value="{{ book.author }}"
              required
              placeholder="e.g. Robert C. Martin"
              class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"
            />
          </div>

          <div>
            <label for="description" class="block text-sm font-medium text-gray-700 mb-1.5">Description</label>
            <textarea
              id="description"
              name="description"
              rows="4"
              required
              placeholder="A brief summary of the book…"
              class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition resize-none"
            >{{ book.description }}</textarea>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label for="pages" class="block text-sm font-medium text-gray-700 mb-1.5">Pages</label>
              <input
                type="number"
                id="pages"
                name="pages"
                value="{{ book.pages }}"
                min="1"
                required
                placeholder="e.g. 350"
                class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"
              />
            </div>
            <div>
              <label for="price" class="block text-sm font-medium text-gray-700 mb-1.5">Price ($)</label>
              <input
                type="number"
                id="price"
                name="price"
                value="{{ book.price }}"
                min="0"
                step="0.01"
                required
                placeholder="e.g. 29.99"
                class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"
              />
            </div>
          </div>

        </div>

        <div class="mt-8 flex items-center gap-3">
          <button
            type="submit"
            class="inline-flex items-center gap-2 rounded-md bg-indigo-600 px-6 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
            Save Book
          </button>

          {% if book.id %}
            <a href="{% url 'book_detail' book.id %}" class="text-sm text-gray-500 hover:text-gray-700 transition-colors">Cancel</a>
          {% else %}
            <a href="{% url 'book_list' %}" class="text-sm text-gray-500 hover:text-gray-700 transition-colors">Cancel</a>
          {% endif %}
        </div>

      </form>
    </div>
  </div>
</div>
{% endblock %}
