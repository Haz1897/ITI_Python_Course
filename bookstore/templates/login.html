{% extends 'base.html' %}

{% block title %}Login — PageTurner{% endblock %}

{% block main %}
<div class="max-w-md mx-auto">
  <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
    <div class="h-1.5 bg-indigo-500"></div>
    <div class="p-8">

      <h1 class="text-xl font-bold text-gray-900 mb-6">Login</h1>

      {% if messages %}
        {% for message in messages %}
          <div class="mb-4 rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-600">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}

      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="space-y-5">

          <div>
            <label for="id_email" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
            <input
              type="email"
              id="id_email"
              name="email"
              required
              placeholder="you@example.com"
              class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"
            />
          </div>

          <div>
            <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
            <input
              type="password"
              id="id_password"
              name="password"
              required
              placeholder="Your password"
              class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"
            />
          </div>

        </div>

        <div class="mt-8 flex items-center gap-3">
          <button type="submit"
            class="inline-flex items-center gap-2 rounded-md bg-indigo-600 px-6 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
            Login
          </button>
          <a href="{% url 'signup' %}" class="text-sm text-gray-500 hover:text-gray-700 transition-colors">Don't have an account? Sign up</a>
        </div>

      </form>
    </div>
  </div>
</div>
{% endblock %}
